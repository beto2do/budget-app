<div>
  <form (ngSubmit)="onSubmit()" [formGroup]="form">
    @for (controller of controllers(); track controller) {
      <div>
        <budget-dynamic-form-controller
          [controller]="controller"
          [form]="form"
        />
      </div>
    }
    <div>
      <button budgetButton [disabled]="!form.valid" type="submit">
        submit
      </button>
    </div>
  </form>
</div>
